<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles/style1.css">
    <src src="JS/script.js"></src>
    <title>Glowly</title>
</head>

<header>
    <h1>Glowly</h1>
</header>

<body>
    <div class="main">
      
        <div class="container">
            <div class="box">
                <h2>Bienvenido a Glowly</h2>
                <p>La plataforma digna de un Midas!</p>
            </div>
            <div class="box">
                <h2>Inicia Sesion Porfavor</h2>
                <p>Ingresa a tu cuenta para continuar y crecer sin limites.</p>
                <div class="form-container">
                    <form >
                        <label for="username">Usuario:</label>
                        <br>
                        <input type="text" name="username" placeholder="Usuario" required>
                        <br>
                        <label for="password">Contraseña:</label>
                        <br>
                        <input type="password" name="password" placeholder="Contraseña" required>
                        <br>
                        <br>
                        <button type="submit">Iniciar Sesión</button>
                    </form>
                </div>

            </div>
            
           
        </div>
         <div class="box">
            <h2>Como? Aun no te has registrado con nosotros?</h2>
            <p>Descuida, puedes crear una nueva cuenta en este enlace.</p>
        </div>
    </div>
</body>
</html>
